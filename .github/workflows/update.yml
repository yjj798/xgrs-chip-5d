name: 每日更新五日筹码

on:
  schedule:
    # 北京时间 16:10（UTC 08:10），工作日运行
    - cron: "10 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "可选：更新指定交易日 YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-chip
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 更新数据与页面
        env:
          UPDATE_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$UPDATE_DATE" ]; then
            python scripts/update_cloud.py --date "$UPDATE_DATE"
          else
            python scripts/update_cloud.py
          fi

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: 更新五日筹码 $(date -u +%Y-%m-%d)"
          git push
