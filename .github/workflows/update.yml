name: 每日更新五日筹码

on:
  schedule:
    # 北京时间工作日 09:20 / 12:00 / 16:00
    - cron: "20 1 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "可选：更新指定交易日 YYYY-MM-DD"
        required: false
        type: string
      mode:
        description: "更新模式；手动默认收盘"
        required: false
        default: "close"
        type: choice
        options:
          - close
          - intraday

permissions:
  contents: write

concurrency:
  group: update-chip
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 选择更新模式
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 8 * * 1-5" ]; then
              echo "UPDATE_MODE=close" >> "$GITHUB_ENV"
            else
              echo "UPDATE_MODE=intraday" >> "$GITHUB_ENV"
            fi
          else
            echo "UPDATE_MODE=${{ github.event.inputs.mode || 'close' }}" >> "$GITHUB_ENV"
          fi

      - name: 更新数据与页面
        env:
          UPDATE_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$UPDATE_DATE" ]; then
            python scripts/update_cloud.py --date "$UPDATE_DATE" --mode "$UPDATE_MODE"
          else
            python scripts/update_cloud.py --mode "$UPDATE_MODE"
          fi

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "auto: 更新五日筹码 $(date -u +%Y-%m-%d)"
          git push
